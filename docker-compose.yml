services:
  app:
    build:
      context: .
      args:
        # 国内服务器可在 .env 里设 PIP_INDEX_URL 加速（见 .env.example）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 对话日志库（MySQL）与缓存（Redis）；可在 .env 覆盖
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://travel:travel@mysql:3306/travel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # 持久化用户长期记忆（profiles.json）与 SQLite 回退库（容器重启不丢）
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 对话日志/统计存储（看板数据底座）
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: travel
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-travel}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utravel", "-ptravel"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # 看板统计的短期缓存
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
