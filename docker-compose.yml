services:
  app:
    build:
      context: .
      args:
        # 国内服务器可在 .env 里设 PIP_INDEX_URL 加速（见 .env.example）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 持久化用户长期记忆（profiles.json），容器重启不丢
      - ./data:/app/data
    restart: unless-stopped
